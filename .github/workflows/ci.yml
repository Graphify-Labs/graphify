name: CI

on:
  push:
    branches: ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "main"]
  pull_request:
    branches: ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "main"]
  workflow_dispatch:

jobs:
  skillgen-check:
    # Fast lint-style guard: the skill files under graphify/ are generated from
    # the fragments in tools/skillgen/. This fails if someone hand-edited a
    # generated file or forgot to re-run the generator and bless expected/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Check generated skill artifacts are up to date
        run: uv run python -m tools.skillgen --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short

      - name: Verify install works end-to-end
        run: |
          uv run graphify --help
          uv run graphify install
