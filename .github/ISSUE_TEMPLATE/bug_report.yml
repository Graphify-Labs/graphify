name: Bug report
description: Report incorrect behavior, a crash, or a regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Include the smallest reproducible example you can.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have checked the Troubleshooting section in the README
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and the behavior you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include commands, input files, and the smallest useful example.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output or graph output
      description: Paste the relevant traceback, diagnostic, or incorrect result.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Graphify version
      placeholder: "e.g. 0.9.68"

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - WSL
    validations:
      required: true

  - type: dropdown
    id: python
    attributes:
      label: Python Version
      options:
        - 3.10
        - 3.11
        - 3.12
        - 3.13
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method
      options:
        - uv tool install (recommended)
        - pipx
        - pip
        - built from source (git clone)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Additional Environment Details
      description: List any provider environment variables set (e.g., OPENAI_API_KEY) and whether a clean checkout reproduced the issue.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add related files, screenshots, or links if they help explain the issue.
