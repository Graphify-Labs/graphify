labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking. Before posting, please check the
        [docs](https://docs.graphify.com) and search existing
        [discussions](https://github.com/Graphify-Labs/graphify/discussions)
        and [issues](https://github.com/Graphify-Labs/graphify/issues) — your
        question may already be answered. For real-time help, join the
        [Discord](https://discord.gg/XDnKVpzdXB). If you have found a bug, please
        open an issue instead so it can be tracked.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Describe the goal and the question, not only the error.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands you ran, docs you read, and what happened.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: graphify version and environment
      description: Output of `graphify --version`, plus your OS and Python version.
      placeholder: "graphify 0.9.70, macOS 15, Python 3.12"
    validations:
      required: false
