<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>graphify — Interactive Playground</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f1a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── Top bar ── */
  #topbar {
    display: flex; align-items: center; gap: 16px; padding: 10px 18px;
    background: #1a1a2e; border-bottom: 1px solid #2a2a4e; flex-shrink: 0; flex-wrap: wrap;
  }
  #topbar-brand { display: flex; align-items: center; gap: 10px; }
  #topbar-brand .brand-name { font-size: 15px; font-weight: 700; color: #4E79A7; letter-spacing: 0.02em; }
  #topbar-brand .brand-tag { font-size: 11px; color: #555; }
  #example-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .ex-tab {
    padding: 5px 13px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1.5px solid #2a2a4e;
    background: transparent; color: #aaa; transition: all 0.15s;
  }
  .ex-tab:hover { border-color: #4E79A7; color: #e0e0e0; }
  .ex-tab.active { background: #4E79A7; border-color: #4E79A7; color: #fff; font-weight: 600; }
  #topbar-meta { margin-left: auto; font-size: 11px; color: #555; white-space: nowrap; }

  /* ── Main area ── */
  #main { display: flex; flex: 1; overflow: hidden; }
  #graph-container { flex: 1; position: relative; }
  #graph { width: 100%; height: 100%; }

  #loading-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #0f0f1a; gap: 12px;
    font-size: 13px; color: #555;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid #2a2a4e; border-top-color: #4E79A7;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px; background: #1a1a2e; border-left: 1px solid #2a2a4e;
    display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
  }
  #search-wrap { padding: 12px; border-bottom: 1px solid #2a2a4e; }
  #search {
    width: 100%; background: #0f0f1a; border: 1px solid #3a3a5e; color: #e0e0e0;
    padding: 7px 10px; border-radius: 6px; font-size: 13px; outline: none;
  }
  #search:focus { border-color: #4E79A7; }
  #search-results {
    max-height: 140px; overflow-y: auto; padding: 4px 12px;
    border-bottom: 1px solid #2a2a4e; display: none;
  }
  .search-item {
    padding: 4px 6px; cursor: pointer; border-radius: 4px; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .search-item:hover { background: #2a2a4e; }
  #info-panel { padding: 14px; border-bottom: 1px solid #2a2a4e; min-height: 140px; }
  #info-panel h3 { font-size: 13px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  #info-content { font-size: 13px; color: #ccc; line-height: 1.6; }
  #info-content .field { margin-bottom: 5px; }
  #info-content .field b { color: #e0e0e0; }
  #info-content .empty { color: #555; font-style: italic; }
  .neighbor-link {
    display: block; padding: 2px 6px; margin: 2px 0; border-radius: 3px; cursor: pointer;
    font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-left: 3px solid #333;
  }
  .neighbor-link:hover { background: #2a2a4e; }
  #neighbors-list { max-height: 160px; overflow-y: auto; margin-top: 4px; }
  #legend-wrap { flex: 1; overflow-y: auto; padding: 12px; }
  #legend-wrap h3 { font-size: 13px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 0;
    cursor: pointer; border-radius: 4px; font-size: 12px;
  }
  .legend-item:hover { background: #2a2a4e; padding-left: 4px; }
  .legend-item.dimmed { opacity: 0.35; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { color: #666; font-size: 11px; }
  #stats { padding: 10px 14px; border-top: 1px solid #2a2a4e; font-size: 11px; color: #555; }
  #legend-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px 0; }
  #legend-controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: #aaa; user-select: none; }
  #legend-controls label:hover { color: #e0e0e0; }
  .legend-cb, #select-all-cb {
    appearance: none; -webkit-appearance: none; width: 14px; height: 14px;
    border: 1.5px solid #3a3a5e; border-radius: 3px; background: #0f0f1a;
    cursor: pointer; position: relative; flex-shrink: 0;
  }
  .legend-cb:checked, #select-all-cb:checked { background: #4E79A7; border-color: #4E79A7; }
  .legend-cb:checked::after, #select-all-cb:checked::after {
    content: ''; position: absolute; left: 3.5px; top: 1px; width: 4px; height: 7px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  #select-all-cb:indeterminate { background: #4E79A7; border-color: #4E79A7; }
  #select-all-cb:indeterminate::after {
    content: ''; position: absolute; left: 2px; top: 5px;
    width: 8px; height: 2px; background: #fff; border: none; transform: none;
  }
  #legend { }

  /* ── Description banner ── */
  #desc-bar {
    padding: 6px 18px; background: #13132a; border-bottom: 1px solid #1e1e3a;
    font-size: 12px; color: #666; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  }
  #desc-bar a { color: #4E79A7; text-decoration: none; }
  #desc-bar a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-brand">
    <span class="brand-name">graphify</span>
    <span class="brand-tag">playground</span>
  </div>
  <div id="example-tabs">
    <button class="ex-tab" data-key="httpx">httpx (144 nodes)</button>
    <button class="ex-tab" data-key="karpathy-repos">karpathy repos (177 nodes)</button>
    <button class="ex-tab" data-key="rsl-siege-manager">rsl-siege-manager (1 886 nodes)</button>
    <button class="ex-tab" data-key="mixed-corpus">mixed corpus (22 nodes)</button>
  </div>
  <div id="topbar-meta"></div>
</div>

<div id="desc-bar" style="display:none"></div>

<div id="main">
  <div id="graph-container">
    <div id="graph"></div>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <span>Select an example above to explore a graph</span>
    </div>
  </div>
  <div id="sidebar">
    <div id="search-wrap">
      <input id="search" type="text" placeholder="Search nodes…" autocomplete="off" disabled>
    </div>
    <div id="search-results"></div>
    <div id="info-panel">
      <h3>Node Details</h3>
      <div id="info-content"><span class="empty">Click a node to inspect it</span></div>
    </div>
    <div id="legend-wrap">
      <h3>Communities</h3>
      <div id="legend-controls">
        <label>
          <input type="checkbox" id="select-all-cb" checked>
          All
        </label>
      </div>
      <div id="legend"></div>
    </div>
    <div id="stats" id="stats"></div>
  </div>
</div>

<script>
const COMMUNITY_COLORS = [
  "#4E79A7","#F28E2B","#E15759","#76B7B2","#59A14F",
  "#EDC948","#B07AA1","#FF9DA7","#9C755F","#BAB0AC",
];

const EXAMPLES = {
  "httpx": {
    json: "../worked/httpx/graph.json",
    desc: 'Synthetic 6-file Python codebase modeled after <a href="https://github.com/encode/httpx" target="_blank">httpx</a>. 144 nodes · 330 edges · 6 communities.',
  },
  "karpathy-repos": {
    json: "../worked/karpathy-repos/graph.json",
    desc: 'Three Karpathy repos (nanoGPT, minGPT, micrograd) + 5 research PDFs. 177 nodes · 246 edges · 71.5× token reduction benchmark.',
  },
  "rsl-siege-manager": {
    json: "../worked/rsl-siege-manager/graph.json",
    desc: 'Real-world full-stack monorepo: FastAPI backend + React/Vite frontend + Discord bot. 1 886 nodes · 3 876 edges.',
  },
  "mixed-corpus": {
    json: "../worked/mixed-corpus/graph.json",
    desc: 'Three Python modules + a markdown paper with arXiv citations. Small mixed-input demo. 22 nodes · 38 edges.',
  },
};

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let network = null;
let nodesDS = null;
let edgesDS = null;
let RAW_NODES = [];
let LEGEND = [];

function buildVisData(graphJson) {
  const nodes = graphJson.nodes || [];
  const links = graphJson.links || [];

  // Compute degree
  const degree = {};
  nodes.forEach(n => { degree[n.id] = 0; });
  links.forEach(e => {
    if (degree[e.source] !== undefined) degree[e.source]++;
    if (degree[e.target] !== undefined) degree[e.target]++;
  });
  const maxDeg = Math.max(1, ...Object.values(degree));

  // Community → color (ordered by first appearance, matching Python: cid % len)
  const communityCounts = {};
  nodes.forEach(n => {
    const cid = n.community ?? 0;
    communityCounts[cid] = (communityCounts[cid] || 0) + 1;
  });

  const visNodes = nodes.map(n => {
    const cid = n.community ?? 0;
    const color = COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length];
    const deg = degree[n.id] || 0;
    const size = 10 + 30 * (deg / maxDeg);
    const fontSize = deg >= maxDeg * 0.15 ? 12 : 0;
    return {
      id: n.id,
      label: n.label || n.id,
      color: { background: color, border: color, highlight: { background: '#ffffff', border: color } },
      size: Math.round(size * 10) / 10,
      font: { size: fontSize, color: '#ffffff' },
      title: esc(n.label || n.id),
      community: cid,
      _community_name: `Community ${cid}`,
      _source_file: n.source_file || '',
      _file_type: n.file_type || '',
      _degree: deg,
    };
  });

  const visEdges = links.map((e, i) => {
    const confidence = e.confidence || 'EXTRACTED';
    return {
      id: i,
      from: e.source,
      to: e.target,
      label: e.relation || '',
      title: esc(`${e.relation || ''} [${confidence}]`),
      dashes: confidence !== 'EXTRACTED',
      width: confidence === 'EXTRACTED' ? 2 : 1,
      color: { opacity: confidence === 'EXTRACTED' ? 0.7 : 0.35 },
    };
  });

  // Legend: sort communities by count desc
  const legendData = Object.entries(communityCounts)
    .map(([cid, count]) => ({ cid: Number(cid), color: COMMUNITY_COLORS[Number(cid) % COMMUNITY_COLORS.length], label: `Community ${cid}`, count }))
    .sort((a, b) => b.count - a.count);

  return { visNodes, visEdges, legendData };
}

function renderLegend(legendData) {
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';
  LEGEND = legendData;

  const hiddenCommunities = new Set();
  const selectAllCb = document.getElementById('select-all-cb');

  function updateSelectAllState() {
    const total = LEGEND.length;
    const hidden = hiddenCommunities.size;
    selectAllCb.indeterminate = hidden > 0 && hidden < total;
    selectAllCb.checked = hidden === 0;
  }

  selectAllCb.onchange = null;
  selectAllCb.addEventListener('change', () => {
    const hide = !selectAllCb.checked;
    document.querySelectorAll('.legend-cb').forEach(cb => { cb.checked = !hide; });
    document.querySelectorAll('.legend-item').forEach(item => {
      hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
    });
    LEGEND.forEach(c => { hide ? hiddenCommunities.add(c.cid) : hiddenCommunities.delete(c.cid); });
    nodesDS.update(RAW_NODES.map(n => ({ id: n.id, hidden: hide })));
    updateSelectAllState();
  });

  legendData.forEach(c => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.cid = c.cid;

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'legend-cb';
    cb.checked = true;
    cb.addEventListener('change', e => {
      e.stopPropagation();
      if (cb.checked) {
        hiddenCommunities.delete(c.cid);
        item.classList.remove('dimmed');
      } else {
        hiddenCommunities.add(c.cid);
        item.classList.add('dimmed');
      }
      nodesDS.update(RAW_NODES.filter(n => n.community === c.cid).map(n => ({ id: n.id, hidden: !cb.checked })));
      updateSelectAllState();
    });
    item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div><span class="legend-label">${esc(c.label)}</span><span class="legend-count">${c.count}</span>`;
    item.prepend(cb);
    item.addEventListener('click', e => {
      if (e.target === cb) return;
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });
    legendEl.appendChild(item);
  });
}

function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    const color = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(color)}" onclick="focusNode(${JSON.stringify(nid)})">${esc(nb ? nb.label : nid)}</span>`;
  }).join('');
  document.getElementById('info-content').innerHTML = `
    <div class="field"><b>${esc(n.label)}</b></div>
    <div class="field">Type: ${esc(n._file_type || 'unknown')}</div>
    <div class="field">Community: ${esc(n._community_name)}</div>
    <div class="field">Source: ${esc(n._source_file || '—')}</div>
    <div class="field">Degree: ${n._degree}</div>
    ${neighborIds.length ? `<div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Neighbors (${neighborIds.length})</div><div id="neighbors-list">${neighborItems}</div>` : ''}
  `;
}

function focusNode(nodeId) {
  network.focus(nodeId, { scale: 1.4, animation: true });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

async function loadExample(key) {
  const ex = EXAMPLES[key];
  if (!ex) return;

  // Reset UI
  document.querySelectorAll('.ex-tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  const overlay = document.getElementById('loading-overlay');
  overlay.innerHTML = '<div class="spinner"></div><span>Loading graph…</span>';
  overlay.style.display = 'flex';
  document.getElementById('info-content').innerHTML = '<span class="empty">Click a node to inspect it</span>';
  document.getElementById('search').disabled = true;
  document.getElementById('search').value = '';
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('topbar-meta').textContent = '';

  const descBar = document.getElementById('desc-bar');
  descBar.innerHTML = ex.desc;
  descBar.style.display = 'flex';

  let graphJson;
  try {
    const resp = await fetch(ex.json);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    graphJson = await resp.json();
  } catch (err) {
    overlay.innerHTML = `<span style="color:#E15759">Failed to load ${esc(ex.json)}: ${esc(err.message)}</span>`;
    return;
  }

  const { visNodes, visEdges, legendData } = buildVisData(graphJson);
  RAW_NODES = visNodes;

  if (network) { network.destroy(); network = null; }

  nodesDS = new vis.DataSet(visNodes);
  edgesDS = new vis.DataSet(visEdges);

  const container = document.getElementById('graph');
  network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
    physics: {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: {
        gravitationalConstant: -60,
        centralGravity: 0.005,
        springLength: 120,
        springConstant: 0.08,
        damping: 0.4,
        avoidOverlap: 0.8,
      },
      stabilization: { iterations: 200, fit: true },
    },
    interaction: { hover: true, tooltipDelay: 100, hideEdgesOnDrag: true, navigationButtons: false, keyboard: false },
    nodes: { shape: 'dot', borderWidth: 1.5 },
    edges: { smooth: { type: 'continuous', roundness: 0.2 }, selectionWidth: 3 },
  });

  network.once('stabilizationIterationsDone', () => {
    network.setOptions({ physics: { enabled: false } });
    overlay.style.display = 'none';
    document.getElementById('search').disabled = false;
    document.getElementById('topbar-meta').textContent = `${visNodes.length} nodes · ${visEdges.length} edges`;
  });

  // Hover/click
  let hoveredNodeId = null;
  network.on('hoverNode', p => { hoveredNodeId = p.node; container.style.cursor = 'pointer'; });
  network.on('blurNode', () => { hoveredNodeId = null; container.style.cursor = 'default'; });
  container.addEventListener('click', () => {
    if (hoveredNodeId !== null) { showInfo(hoveredNodeId); network.selectNodes([hoveredNodeId]); }
  });
  network.on('click', params => {
    if (params.nodes.length > 0) showInfo(params.nodes[0]);
    else if (hoveredNodeId === null) document.getElementById('info-content').innerHTML = '<span class="empty">Click a node to inspect it</span>';
  });

  // Search
  const searchInput = document.getElementById('search');
  const searchResults = document.getElementById('search-results');
  searchInput.oninput = null;
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    searchResults.innerHTML = '';
    if (!q) { searchResults.style.display = 'none'; return; }
    const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
    if (!matches.length) { searchResults.style.display = 'none'; return; }
    searchResults.style.display = 'block';
    matches.forEach(n => {
      const el = document.createElement('div');
      el.className = 'search-item';
      el.textContent = n.label;
      el.style.borderLeft = `3px solid ${n.color.background}`;
      el.style.paddingLeft = '8px';
      el.onclick = () => {
        network.focus(n.id, { scale: 1.5, animation: true });
        network.selectNodes([n.id]);
        showInfo(n.id);
        searchResults.style.display = 'none';
        searchInput.value = '';
      };
      searchResults.appendChild(el);
    });
  });

  document.addEventListener('click', e => {
    if (!searchResults.contains(e.target) && e.target !== searchInput)
      searchResults.style.display = 'none';
  }, { once: false });

  renderLegend(legendData);
  document.getElementById('stats').textContent = `${visNodes.length} nodes · ${visEdges.length} edges · ${legendData.length} communities`;
}

// Wire up tabs
document.querySelectorAll('.ex-tab').forEach(tab => {
  tab.addEventListener('click', () => loadExample(tab.dataset.key));
});

// Auto-load httpx on first visit
loadExample('httpx');
</script>
</body>
</html>
