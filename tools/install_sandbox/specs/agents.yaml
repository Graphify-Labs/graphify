universal_uninstall_scopes: [user]
scopes:
  user:
    uninstall_mode: direct
    effects:
      - kind: skill
        root: home
        path: .agents/skills/graphify/SKILL.md
        source: graphify/skill-agents.md
        reference_bundle: agents
  project:
    effects:
      - kind: skill
        root: project
        path: .agents/skills/graphify/SKILL.md
        source: graphify/skill-agents.md
        reference_bundle: agents
